name: Windows Runtime Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'resources/plc-runtime/**'
      - '.github/workflows/test-windows-runtime.yml'

jobs:
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Step 1: iec2c.exe resolves and is executable ───────────────────────
      - name: Test iec2c.exe is present
        shell: cmd
        run: |
          if not exist "resources\plc-runtime\matiec\win32-x64\iec2c.exe" (
            echo ERROR: iec2c.exe not found
            exit /b 1
          )
          echo iec2c.exe found OK
          dir resources\plc-runtime\matiec\win32-x64\

      - name: Test iec2c.exe runs (validate a minimal ST program)
        shell: cmd
        run: |
          mkdir %TEMP%\matiec-out 2>nul
          (echo PROGRAM test) > %TEMP%\test.st
          (echo  VAR) >> %TEMP%\test.st
          (echo   x : BOOL;) >> %TEMP%\test.st
          (echo  END_VAR) >> %TEMP%\test.st
          (echo  x := TRUE;) >> %TEMP%\test.st
          (echo END_PROGRAM) >> %TEMP%\test.st
          set "PATH=%CD%\resources\plc-runtime\matiec\win32-x64;%PATH%"
          resources\plc-runtime\matiec\win32-x64\iec2c.exe -I resources\plc-runtime\matiec\lib -T %TEMP%\matiec-out %TEMP%\test.st
          if %ERRORLEVEL% neq 0 (
            echo ERROR: iec2c.exe failed
            dir %TEMP%\matiec-out 2>nul
            exit /b 1
          )
          echo iec2c.exe compiled test ST successfully
          dir %TEMP%\matiec-out

      # ── Step 2: Python.exe starts and all Flask deps import ───────────────
      - name: Test Python.exe is present
        shell: cmd
        run: |
          if not exist "resources\plc-runtime\python\win32-x64\python.exe" (
            echo ERROR: python.exe not found
            exit /b 1
          )
          resources\plc-runtime\python\win32-x64\python.exe --version
          echo Python.exe OK

      - name: Test Flask and all webserver deps import
        shell: cmd
        run: |
          set "PYTHONPATH=%CD%\resources\plc-runtime\python\win32-x64\Lib\site-packages"
          resources\plc-runtime\python\win32-x64\python.exe -c ^
            "import flask, flask_login, flask_jwt_extended, flask_sqlalchemy, flask_socketio, jwt, dotenv, psutil, serial; print('ALL IMPORTS OK')"
          if %ERRORLEVEL% neq 0 (
            echo ERROR: One or more Flask imports failed
            exit /b 1
          )

      # ── Step 3: OpenPLC webserver starts and listens on 8443 ─────────────
      - name: Start OpenPLC webserver
        shell: cmd
        run: |
          set "PYTHONPATH=%CD%\resources\plc-runtime\openplc-runtime-v4;%CD%\resources\plc-runtime\python\win32-x64\Lib\site-packages"
          set "OPENPLC_RUNTIME_PATH=%TEMP%\plc_main"
          start /b resources\plc-runtime\python\win32-x64\python.exe -m webserver.app ^
            > %TEMP%\webserver.log 2>&1
          echo Webserver started in background, waiting 10s...

      - name: Wait for webserver to be ready
        shell: cmd
        run: |
          set WAITED=0
          :loop
          if %WAITED% GEQ 60 goto timeout
          timeout /t 3 /nobreak >nul
          set /a WAITED=%WAITED%+3
          curl.exe -k -s -o nul -w "%%{http_code}" https://localhost:8443/api/status > %TEMP%\httpcode.txt 2>nul
          set /p HTTPCODE=<%TEMP%\httpcode.txt
          if "%HTTPCODE%"=="000" (
            echo [%WAITED%/60 s] No connection yet...
            goto loop
          )
          echo Webserver UP - HTTP %HTTPCODE% - Flask is accepting connections
          goto done
          :timeout
          echo ERROR: Webserver did not start within 60s
          type %TEMP%\webserver.log 2>nul
          exit /b 1
          :done

      - name: Test create-user endpoint
        shell: cmd
        run: |
          curl.exe -k -s -o %TEMP%\create-user.json -w "%%{http_code}" ^
            -X POST https://localhost:8443/api/create-user ^
            -H "Content-Type: application/json" ^
            -d "{\"login\":\"volt-internal\",\"password\":\"volt-test-pass-123\"}" ^
            > %TEMP%\create-user-code.txt 2>nul
          set /p CODE=<%TEMP%\create-user-code.txt
          type %TEMP%\create-user.json
          echo.
          echo create-user HTTP %CODE% (200=created, 401=already exists, both OK)
          if "%CODE%"=="200" goto ok
          if "%CODE%"=="401" goto ok
          echo ERROR: Unexpected status %CODE%
          exit /b 1
          :ok

      - name: Test login and get JWT token
        shell: cmd
        run: |
          curl.exe -k -s -o %TEMP%\login.json ^
            -X POST https://localhost:8443/api/login ^
            -H "Content-Type: application/json" ^
            -d "{\"login\":\"volt-internal\",\"password\":\"volt-test-pass-123\"}"
          type %TEMP%\login.json
          echo.
          findstr "access_token" %TEMP%\login.json >nul
          if %ERRORLEVEL% neq 0 (
            echo ERROR: No access_token in login response
            exit /b 1
          )
          echo JWT token obtained OK
          for /f "tokens=2 delims=:, " %%a in ('findstr "access_token" %TEMP%\login.json') do (
            set TOKEN=%%~a
          )
          echo JWT=%TOKEN:"=% >> %GITHUB_ENV%

      # ── Step 4: Upload a minimal ZIP and verify g++ compiles it ──────────
      - name: Build test ZIP (minimal ST program)
        shell: powershell
        run: |
          # Create a minimal valid ZIP that OpenPLC can compile
          $tmpDir = "$env:TEMP\volt-test-zip"
          New-Item -ItemType Directory -Force -Path $tmpDir | Out-Null

          # Minimal generated.hpp
          @"
          #pragma once
          #include "strucpp_runtime/include/iec_std_lib.hpp"
          class PROGRAM0 {
          public:
            IEC_BOOL x;
            void run() { x = IEC_BOOL(1); }
          };
          "@ | Out-File "$tmpDir\generated.hpp" -Encoding utf8

          # Minimal main.cpp
          @"
          #include "generated.hpp"
          PROGRAM0 prog;
          extern "C" void plc_run() { prog.run(); }
          "@ | Out-File "$tmpDir\main.cpp" -Encoding utf8

          # generated_debug.cpp (required symbols)
          @"
          #include <cstdint>
          namespace strucpp { namespace debug {
            const uint8_t* get_debug_data() { return nullptr; }
            uint32_t get_debug_data_size() { return 0; }
          }}
          "@ | Out-File "$tmpDir\generated_debug.cpp" -Encoding utf8

          # CMakeLists.txt
          @"
          cmake_minimum_required(VERSION 3.10)
          project(plc_program)
          add_library(plc_program SHARED main.cpp generated_debug.cpp)
          "@ | Out-File "$tmpDir\CMakeLists.txt" -Encoding utf8

          # ZIP it
          Compress-Archive -Path "$tmpDir\*" -DestinationPath "$env:TEMP\test-program.zip" -Force
          Write-Host "Test ZIP created: $((Get-Item "$env:TEMP\test-program.zip").Length) bytes"

      - name: Upload ZIP to OpenPLC
        shell: cmd
        run: |
          curl.exe -k -s -o %TEMP%\upload.json -w "%%{http_code}" ^
            -X POST https://localhost:8443/api/upload-file ^
            -H "Authorization: Bearer %JWT%" ^
            -F "file=@%TEMP%\test-program.zip;type=application/zip" ^
            > %TEMP%\upload-code.txt
          set /p UPLOADCODE=<%TEMP%\upload-code.txt
          type %TEMP%\upload.json
          echo.
          echo Upload HTTP %UPLOADCODE%
          if "%UPLOADCODE%"=="200" goto ok
          echo ERROR: Upload failed with HTTP %UPLOADCODE%
          exit /b 1
          :ok
          echo Upload accepted

      - name: Poll compilation status until SUCCESS or ERROR
        shell: cmd
        run: |
          set WAITED=0
          :pollloop
          if %WAITED% GEQ 90 goto polltimeout
          timeout /t 4 /nobreak >nul
          set /a WAITED=%WAITED%+4
          curl.exe -k -s -o %TEMP%\status.json ^
            -H "Authorization: Bearer %JWT%" ^
            https://localhost:8443/api/compilation-status
          type %TEMP%\status.json
          echo.
          findstr /i "SUCCESS" %TEMP%\status.json >nul
          if %ERRORLEVEL%==0 (
            echo g++ compile SUCCESS
            goto polldone
          )
          findstr /i "ERROR" %TEMP%\status.json >nul
          if %ERRORLEVEL%==0 (
            echo ERROR: g++ compile failed
            exit /b 1
          )
          echo [%WAITED%/90 s] Still compiling...
          goto pollloop
          :polltimeout
          echo ERROR: Compile timed out after 90s
          exit /b 1
          :polldone

      # ── Diagnostics on failure ────────────────────────────────────────────
      - name: Show webserver log on failure
        if: failure()
        shell: cmd
        run: |
          echo === Webserver log ===
          type %TEMP%\webserver.log 2>nul || echo (no log file)
