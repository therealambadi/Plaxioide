name: Windows Runtime Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'resources/plc-runtime/**'
      - '.github/workflows/test-windows-runtime.yml'

jobs:
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Step 1: iec2c.exe resolves and is executable ───────────────────────
      - name: Test iec2c.exe is present
        shell: cmd
        run: |
          if not exist "resources\plc-runtime\matiec\win32-x64\iec2c.exe" (
            echo ERROR: iec2c.exe not found
            exit /b 1
          )
          echo iec2c.exe found OK
          dir resources\plc-runtime\matiec\win32-x64\

      - name: Test iec2c.exe runs (validate a minimal ST program)
        shell: cmd
        run: |
          mkdir %TEMP%\matiec-out 2>nul
          (echo PROGRAM test) > %TEMP%\test.st
          (echo  VAR) >> %TEMP%\test.st
          (echo   x : BOOL;) >> %TEMP%\test.st
          (echo  END_VAR) >> %TEMP%\test.st
          (echo  x := TRUE;) >> %TEMP%\test.st
          (echo END_PROGRAM) >> %TEMP%\test.st
          set "PATH=%CD%\resources\plc-runtime\matiec\win32-x64;%PATH%"
          resources\plc-runtime\matiec\win32-x64\iec2c.exe -I resources\plc-runtime\matiec\lib -T %TEMP%\matiec-out %TEMP%\test.st
          if %ERRORLEVEL% neq 0 (
            echo ERROR: iec2c.exe failed
            dir %TEMP%\matiec-out 2>nul
            exit /b 1
          )
          echo iec2c.exe compiled test ST successfully
          dir %TEMP%\matiec-out

      # ── Step 2: Python.exe starts and all Flask deps import ───────────────
      - name: Test Python.exe is present
        shell: cmd
        run: |
          if not exist "resources\plc-runtime\python\win32-x64\python.exe" (
            echo ERROR: python.exe not found
            exit /b 1
          )
          resources\plc-runtime\python\win32-x64\python.exe --version
          echo Python.exe OK

      - name: Test Flask and all webserver deps import
        shell: cmd
        run: |
          set "PYTHONPATH=%CD%\resources\plc-runtime\python\win32-x64\Lib\site-packages"
          resources\plc-runtime\python\win32-x64\python.exe -c ^
            "import flask, flask_login, flask_jwt_extended, flask_sqlalchemy, flask_socketio, jwt, dotenv, psutil, serial; print('ALL IMPORTS OK')"
          if %ERRORLEVEL% neq 0 (
            echo ERROR: One or more Flask imports failed
            exit /b 1
          )

      # ── Step 3: OpenPLC webserver starts and listens on 8443 ─────────────
      - name: Start OpenPLC webserver
        shell: powershell
        run: |
          $root = (Get-Location).Path
          $pythonExe = "$root\resources\plc-runtime\python\win32-x64\python.exe"
          $runtimeDir = "$root\resources\plc-runtime\openplc-runtime-v4"
          $sitePkgs = "$root\resources\plc-runtime\python\win32-x64\Lib\site-packages"

          Write-Host "Python: $pythonExe"
          Write-Host "CWD:    $runtimeDir"

          if (-not (Test-Path $pythonExe)) { Write-Host "ERROR: python.exe not found"; exit 1 }
          if (-not (Test-Path "$runtimeDir\webserver\app.py")) { Write-Host "ERROR: webserver/app.py not found"; exit 1 }

          # Quick sanity: confirm webserver.app is importable before launching
          $env:PYTHONPATH = "$runtimeDir;$sitePkgs"
          $env:OPENPLC_RUNTIME_PATH = "$env:TEMP\plc_main"
          $out = & $pythonExe -c "import webserver.app; print('IMPORT_OK')" 2>&1
          Write-Host "Import check: $out"
          if ("$out" -notmatch "IMPORT_OK") {
            Write-Host "ERROR: webserver.app import failed - Flask or deps missing"
            exit 1
          }

          # Write a launcher .bat using Add-Content to avoid here-string YAML issues
          $batPath = "$env:TEMP\start-webserver.bat"
          $logOut  = "$env:TEMP\webserver-stdout.log"
          $logErr  = "$env:TEMP\webserver-stderr.log"
          Remove-Item $batPath -ErrorAction SilentlyContinue
          Add-Content $batPath "@echo off"
          Add-Content $batPath "set PYTHONPATH=$runtimeDir;$sitePkgs"
          Add-Content $batPath "set OPENPLC_RUNTIME_PATH=$env:TEMP\plc_main"
          Add-Content $batPath "set PYTHONUNBUFFERED=1"
          Add-Content $batPath "cd /d `"$runtimeDir`""
          Add-Content $batPath "`"$pythonExe`" -m webserver.app > `"$logOut`" 2> `"$logErr`""
          Write-Host "Launching via bat: $batPath"
          Get-Content $batPath | ForEach-Object { Write-Host "  BAT: $_" }
          $proc = Start-Process -FilePath "cmd.exe" -ArgumentList "/c `"$batPath`"" -PassThru -WindowStyle Hidden
          $proc.Id | Out-File "$env:TEMP\webserver.pid" -Encoding utf8
          Write-Host "Webserver process started (PID $($proc.Id))"

      - name: Wait for webserver to be ready
        shell: powershell
        run: |
          $waited = 0
          $ready = $false
          while ($waited -lt 60) {
            Start-Sleep -Seconds 3
            $waited += 3
            try {
              $code = & curl.exe -k -s -o NUL -w "%{http_code}" https://localhost:8443/api/status 2>$null
              Write-Host "[$waited/60 s] curl returned: $code"
              if ($code -ne "000" -and $code -ne "") {
                Write-Host "Webserver UP - HTTP $code - Flask is accepting connections"
                $ready = $true
                break
              }
            } catch {
              Write-Host "[$waited/60 s] curl error: $_"
            }
            Write-Host "[$waited/60 s] No connection yet..."
          }
          if (-not $ready) {
            Write-Host "ERROR: Webserver did not start within 60s"
            Write-Host "=== stdout ==="
            Get-Content "$env:TEMP\webserver-stdout.log" -ErrorAction SilentlyContinue
            Write-Host "=== stderr ==="
            Get-Content "$env:TEMP\webserver-stderr.log" -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Test create-user endpoint
        shell: powershell
        run: |
          # Write JSON body to file to avoid PowerShell/curl quoting issues on Windows
          '{"login":"volt-internal","password":"volt-test-pass-123"}' | Out-File "$env:TEMP\creds.json" -Encoding utf8 -NoNewline
          $code = & curl.exe -k -s -o "$env:TEMP\create-user.json" -w "%{http_code}" `
            -X POST https://localhost:8443/api/create-user `
            -H "Content-Type: application/json" `
            --data-binary "@$env:TEMP\creds.json"
          Get-Content "$env:TEMP\create-user.json" -ErrorAction SilentlyContinue
          Write-Host "create-user HTTP $code (200=created, 401=already exists, both OK)"
          if ($code -ne "200" -and $code -ne "401") {
            Write-Host "ERROR: Unexpected status $code"
            exit 1
          }

      - name: Test login and get JWT token
        shell: powershell
        run: |
          '{"login":"volt-internal","password":"volt-test-pass-123"}' | Out-File "$env:TEMP\creds.json" -Encoding utf8 -NoNewline
          & curl.exe -k -s -o "$env:TEMP\login.json" `
            -X POST https://localhost:8443/api/login `
            -H "Content-Type: application/json" `
            --data-binary "@$env:TEMP\creds.json"
          $body = Get-Content "$env:TEMP\login.json" -Raw
          Write-Host $body
          if ($body -notmatch '"access_token"') {
            Write-Host "ERROR: No access_token in login response"
            exit 1
          }
          Write-Host "JWT token obtained OK"
          $token = ($body | ConvertFrom-Json).access_token
          "JWT=$token" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      # ── Step 4: Upload a minimal ZIP and verify g++ compiles it ──────────
      - name: Build test ZIP (minimal ST program)
        shell: powershell
        run: |
          # Create a minimal valid ZIP that OpenPLC can compile
          $tmpDir = "$env:TEMP\volt-test-zip"
          New-Item -ItemType Directory -Force -Path $tmpDir | Out-Null

          # Minimal generated.hpp
          @"
          #pragma once
          #include "strucpp_runtime/include/iec_std_lib.hpp"
          class PROGRAM0 {
          public:
            IEC_BOOL x;
            void run() { x = IEC_BOOL(1); }
          };
          "@ | Out-File "$tmpDir\generated.hpp" -Encoding utf8

          # Minimal main.cpp
          @"
          #include "generated.hpp"
          PROGRAM0 prog;
          extern "C" void plc_run() { prog.run(); }
          "@ | Out-File "$tmpDir\main.cpp" -Encoding utf8

          # generated_debug.cpp (required symbols)
          @"
          #include <cstdint>
          namespace strucpp { namespace debug {
            const uint8_t* get_debug_data() { return nullptr; }
            uint32_t get_debug_data_size() { return 0; }
          }}
          "@ | Out-File "$tmpDir\generated_debug.cpp" -Encoding utf8

          # CMakeLists.txt
          @"
          cmake_minimum_required(VERSION 3.10)
          project(plc_program)
          add_library(plc_program SHARED main.cpp generated_debug.cpp)
          "@ | Out-File "$tmpDir\CMakeLists.txt" -Encoding utf8

          # ZIP it
          Compress-Archive -Path "$tmpDir\*" -DestinationPath "$env:TEMP\test-program.zip" -Force
          Write-Host "Test ZIP created: $((Get-Item "$env:TEMP\test-program.zip").Length) bytes"

      - name: Upload ZIP to OpenPLC
        shell: powershell
        run: |
          $code = & curl.exe -k -s -o "$env:TEMP\upload.json" -w "%{http_code}" `
            -X POST https://localhost:8443/api/upload-file `
            -H "Authorization: Bearer $env:JWT" `
            -F "file=@$env:TEMP\test-program.zip;type=application/zip"
          Get-Content "$env:TEMP\upload.json" -ErrorAction SilentlyContinue
          Write-Host "Upload HTTP $code"
          if ($code -ne "200") {
            Write-Host "ERROR: Upload failed with HTTP $code"
            exit 1
          }
          Write-Host "Upload accepted"

      - name: Poll compilation status until SUCCESS or ERROR
        shell: powershell
        run: |
          $waited = 0
          $done = $false
          while ($waited -lt 90) {
            Start-Sleep -Seconds 4
            $waited += 4
            & curl.exe -k -s -o "$env:TEMP\status.json" `
              -H "Authorization: Bearer $env:JWT" `
              https://localhost:8443/api/compilation-status
            $body = Get-Content "$env:TEMP\status.json" -Raw -ErrorAction SilentlyContinue
            Write-Host $body
            if ($body -imatch "SUCCESS") {
              Write-Host "g++ compile SUCCESS"
              $done = $true
              break
            }
            if ($body -imatch "ERROR") {
              Write-Host "ERROR: g++ compile failed"
              exit 1
            }
            Write-Host "[$waited/90 s] Still compiling..."
          }
          if (-not $done) {
            Write-Host "ERROR: Compile timed out after 90s"
            exit 1
          }

      # ── Diagnostics on failure ────────────────────────────────────────────
      - name: Show webserver log on failure
        if: failure()
        shell: powershell
        run: |
          Write-Host "=== Webserver stdout ==="
          Get-Content "$env:TEMP\webserver-stdout.log" -ErrorAction SilentlyContinue
          Write-Host "=== Webserver stderr ==="
          Get-Content "$env:TEMP\webserver-stderr.log" -ErrorAction SilentlyContinue
