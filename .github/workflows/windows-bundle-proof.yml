name: Windows Bundle Zero-Setup Proof

# Clean-runner test: download the MSYS2 bundle from GitHub Release, extract it,
# then run the FULL proof using ONLY the bundled toolchain:
#   1. Build plc_main with bundled g++/make (no system MSYS2)
#   2. Start plc_main with bundle DLLs on PATH
#   3. Motor-start force/read proof
#   4. 10x repeat - PASS=10 FAIL=0 required
#
# NO system MSYS2 is installed on the runner - confirms zero-setup on Windows.
on:
  workflow_dispatch:

jobs:
  bundle-proof:
    name: Bundle zero-setup compile + motor-start proof
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout volt repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Download + extract the MSYS2 bundle ─────────────────────────────────
      - name: Download MSYS2 bundle from GitHub Release
        run: |
          $url = "https://github.com/therealambadi/volt/releases/download/msys2-bundle-v1/msys2-bundle.zip"
          $out = "$env:TEMP\msys2-bundle.zip"
          Write-Host "Downloading MSYS2 bundle (~85 MB)..."
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          $sw.Stop()
          $size = [math]::Round((Get-Item $out).Length / 1MB, 1)
          Write-Host "Downloaded $size MB in $([math]::Round($sw.Elapsed.TotalSeconds, 1)) s"

      - name: Extract bundle
        run: |
          $bundleDir = "C:\msys2-bundle"
          Write-Host "Extracting to $bundleDir ..."
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          Expand-Archive -Path "$env:TEMP\msys2-bundle.zip" -DestinationPath $bundleDir -Force
          $sw.Stop()
          Write-Host "Extracted in $([math]::Round($sw.Elapsed.TotalSeconds, 1)) s"
          "BUNDLE_DIR=$bundleDir"         | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "BUNDLE_BIN=$bundleDir\bin"     | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "BUNDLE_USR=$bundleDir\usr\bin" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Verify bundled toolchain (no system MSYS2)
        run: |
          $binDir = $env:BUNDLE_BIN
          $usrBin = $env:BUNDLE_USR
          $env:PATH = "$binDir;$usrBin;$env:PATH"

          Write-Host "=== bash ==="
          & "$usrBin\bash.exe" --version 2>&1 | Select-Object -First 1
          Write-Host "=== g++ ==="
          & "$usrBin\g++.exe" --version 2>&1 | Select-Object -First 1
          Write-Host "=== make ==="
          & "$usrBin\make.exe" --version 2>&1 | Select-Object -First 1
          Write-Host "=== plc_main.exe in bundle bin/ ==="
          Get-Item "$binDir\plc_main.exe" | Select-Object Name, Length
          Write-Host "TOOLCHAIN VERIFIED - running from bundle, no system MSYS2"

      # ── Clone + patch OpenPLC runtime source ────────────────────────────────
      - name: Clone OpenPLC runtime
        run: |
          git clone https://github.com/Autonomy-Logic/openplc-runtime.git C:\plc-src
          Push-Location C:\plc-src
          git checkout cb1060d
          Write-Host "Cloned: $(git log --oneline -1)"

      - name: Apply macOS baseline patch
        run: |
          $patchFile = "$env:GITHUB_WORKSPACE\openplc-editor-development\openplc-runtime-macos\openplc-runtime-macos-cb1060d.patch"
          & "C:\Program Files\Git\usr\bin\patch.exe" -p1 -d C:\plc-src --input $patchFile
          Write-Host "macOS baseline patch applied"

      - name: Apply Windows patches W1-W12
        run: |
          $f = "$env:GITHUB_WORKSPACE\openplc-editor-development\openplc-runtime-macos\test-fixtures"
          Push-Location C:\plc-src
          python "$f\w1_clock_realtime.py"
          python "$f\w2_sched_fifo.py"
          python "$f\w3_meminfo.py"
          python "$f\w6_patch_app.py"
          python "$f\w8_fix_safe_extract.py"
          python "$f\w10_makefile_lrt.py"
          python "$f\w12_cond_clock.py"
          Write-Host "All Windows patches applied"

      # ── Build plc_main using ONLY the bundled toolchain ─────────────────────
      - name: Build plc_main with bundled g++ (no system MSYS2)
        run: |
          $binDir  = $env:BUNDLE_BIN
          $usrBin  = $env:BUNDLE_USR
          $bundle  = $env:BUNDLE_DIR
          $gccArch = "x86_64-pc-cygwin"
          $gccVer  = "15.3.0"

          $env:PATH              = "$binDir;$usrBin;$env:PATH"
          $env:CPLUS_INCLUDE_PATH = "$bundle\usr\lib\gcc\$gccArch\$gccVer\include\c++"
          $env:C_INCLUDE_PATH     = "$bundle\usr\include"
          $env:LIBRARY_PATH       = "$bundle\usr\lib\gcc\$gccArch\$gccVer;$bundle\usr\lib;$bundle\usr\lib\W32api"

          New-Item -ItemType Directory -Force -Path C:\plc-src\build | Out-Null
          Push-Location C:\plc-src\build

          Write-Host "=== cmake (bundled) ==="
          & "$usrBin\cmake.exe" .. -G "Unix Makefiles" `
            -DCMAKE_C_COMPILER="$usrBin\gcc.exe" `
            -DCMAKE_CXX_COMPILER="$usrBin\g++.exe"
          if ($LASTEXITCODE -ne 0) { Write-Host "cmake FAILED"; exit 1 }

          Write-Host "=== make (bundled) ==="
          & "$usrBin\make.exe" -j4 plc_main
          if ($LASTEXITCODE -ne 0) { Write-Host "make FAILED"; exit 1 }

          $exe = Get-Item "plc_main.exe","plc_main" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Host "ERROR: plc_main not found after build"; exit 1 }
          Write-Host "COMPILE SUCCESS: $($exe.Name) ($([math]::Round($exe.Length/1KB))KB)"
          "BUILT_PLC=$($exe.FullName)" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      # ── Start plc_main and run motor-start force/read proof ─────────────────
      - name: Start freshly-compiled plc_main (bundle DLLs on PATH)
        run: |
          $binDir = $env:BUNDLE_BIN
          $usrBin = $env:BUNDLE_USR
          $plcBin = $env:BUILT_PLC
          $env:PATH = "$binDir;$usrBin;$env:PATH"

          Write-Host "Starting: $plcBin"
          Write-Host "(msys-2.0.dll + python3.12.dll loaded from bundle bin/ - no system MSYS2)"
          $proc = Start-Process -FilePath $plcBin `
            -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput "$env:TEMP\plc_main.log" `
            -RedirectStandardError  "$env:TEMP\plc_err.log"
          Write-Host "plc_main PID: $($proc.Id)"
          Start-Sleep -Seconds 8
          Write-Host "=== plc_main startup (stderr) ==="
          Get-Content "$env:TEMP\plc_err.log" -ErrorAction SilentlyContinue | Select-Object -First 20

      - name: Motor-start force/read proof
        run: |
          Push-Location "$env:GITHUB_WORKSPACE\openplc-editor-development\openplc-runtime-macos\test-fixtures"
          Write-Host "=== Motor-start force/read proof ==="
          node debug-proof.mjs
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== plc_main stdout (last 40) ==="
            Get-Content "$env:TEMP\plc_main.log" -ErrorAction SilentlyContinue | Select-Object -Last 40
            Write-Host "=== plc_main stderr (last 40) ==="
            Get-Content "$env:TEMP\plc_err.log"  -ErrorAction SilentlyContinue | Select-Object -Last 40
            exit 1
          }

      - name: 10x repeat proof
        run: |
          Push-Location "$env:GITHUB_WORKSPACE\openplc-editor-development\openplc-runtime-macos\test-fixtures"
          $pass = 0; $fail = 0
          for ($i = 1; $i -le 10; $i++) {
            node debug-proof.mjs 2>&1 | Out-Null
            if ($LASTEXITCODE -eq 0) { $pass++ } else { $fail++ }
            Write-Host "[$i/10] PASS=$pass FAIL=$fail"
          }
          Write-Host ""
          Write-Host "=== 10x repeat result: PASS=$pass FAIL=$fail ==="
          if ($fail -gt 0) { exit 1 }
          Write-Host "ZERO-SETUP WINDOWS PROOF COMPLETE"
          Write-Host "plc_main compiled and ran using only bundled toolchain - no system MSYS2 required"

      - name: Show logs on failure
        if: failure()
        run: |
          Write-Host "=== plc_main stdout (last 50) ==="
          Get-Content "$env:TEMP\plc_main.log" -ErrorAction SilentlyContinue | Select-Object -Last 50
          Write-Host "=== plc_main stderr (last 50) ==="
          Get-Content "$env:TEMP\plc_err.log"  -ErrorAction SilentlyContinue | Select-Object -Last 50
