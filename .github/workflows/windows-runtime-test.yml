name: Windows Runtime Build & Test

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/windows-runtime-test.yml'
      - 'openplc-editor-development/openplc-runtime-macos/**'
      - 'src/vs/workbench/contrib/void/**'
  schedule:
    # Run every Monday at 03:00 UTC — catches any upstream drift or runner breakage
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  windows-build-test:
    name: MSYS2/MinGW Windows build + motor-start proof
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      # ── 0. Checkout ──────────────────────────────────────────────────────
      - name: Disable git CRLF conversion
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout volt repo
        uses: actions/checkout@v4

      # ── 1. Install MSYS2 with MSYS (Cygwin-compatible POSIX) toolchain ───
      # CRITICAL: must use msystem: MSYS, NOT MINGW64.
      # MINGW64 is a pure Win32 toolchain — it does not provide dlfcn.h,
      # sys/socket.h, AF_UNIX sockets, or POSIX pthreads.
      # MSYS is the Cygwin-compatible layer that provides all POSIX APIs the
      # runtime requires. This matches upstream's own windows-installer.yml.
      - name: Set up MSYS2 (MSYS toolchain — POSIX layer)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: >-
            base-devel
            gcc
            make
            cmake
            pkg-config
            python
            python-pip
            python-setuptools
            git
            patch
            openssl
            openssl-devel
            unzip

      # ── 2. Clone upstream OpenPLC Runtime @ cb1060d ───────────────────────
      - name: Clone upstream OpenPLC Runtime
        run: |
          git clone https://github.com/Autonomy-Logic/openplc-runtime.git /tmp/openplc-runtime
          cd /tmp/openplc-runtime
          git checkout cb1060d
          echo "Upstream commit: $(git log --oneline -1)"

      # ── 3. Apply macOS baseline patch ─────────────────────────────────────
      - name: Apply macOS baseline patch
        run: |
          cd /tmp/openplc-runtime
          patch -p1 < "$GITHUB_WORKSPACE/openplc-editor-development/openplc-runtime-macos/openplc-runtime-macos-cb1060d.patch"
          echo "Patched files:"
          git diff --name-only HEAD

      # ── 4. BUILD WITHOUT W1-W5 — record real compiler errors ─────────────
      - name: "[STEP 3.1] Build WITHOUT W1-W5 patches (expect failures)"
        id: build_no_w
        continue-on-error: true
        run: |
          cd /tmp/openplc-runtime
          mkdir -p build_probe && cd build_probe
          echo "=== CMake ===" && cmake .. -G "Unix Makefiles" 2>&1
          echo "=== Ninja ===" && make -j$(nproc) plc_main 2>&1
          echo "build_probe_exit=$?" >> $GITHUB_ENV

      # ── 5. Apply W1 — extend CLOCK_REALTIME guard ─────────────────────────
      - name: "[W1] Extend CLOCK_REALTIME guard to __MSYS__/__CYGWIN__"
        run: |
          cd /tmp/openplc-runtime
          python3 - <<'PYEOF'
          import sys
          path = 'core/src/plc_app/plc_state_manager.cpp'
          src = open(path).read()
          old = '#ifdef __APPLE__\n    /* On macOS, pthread_cond_timedwait uses CLOCK_REALTIME (the condvar was\n     * initialized without pthread_condattr_setclock, which macOS doesn\'t\n     * support for CLOCK_MONOTONIC).  Use CLOCK_REALTIME here to match. */\n    clock_gettime(CLOCK_REALTIME, &next_tick);\n#else\n    clock_gettime(CLOCK_MONOTONIC, &next_tick);\n#endif'
          new = '#if defined(__APPLE__) || defined(__CYGWIN__) || defined(__MSYS__)\n    /* macOS/MSYS2/Cygwin: pthread_cond_timedwait uses CLOCK_REALTIME.\n     * pthread_condattr_setclock(CLOCK_MONOTONIC) is unsupported. */\n    clock_gettime(CLOCK_REALTIME, &next_tick);\n#else\n    clock_gettime(CLOCK_MONOTONIC, &next_tick);\n#endif'
          if old not in src:
              print('W1 anchor not found — checking if already applied or not needed', file=sys.stderr)
              print('CONTEXT:')
              idx = src.find('clock_gettime(CLOCK_REALTIME, &next_tick)')
              if idx >= 0:
                  print(src[max(0,idx-200):idx+200])
              else:
                  idx2 = src.find('next_tick')
                  if idx2 >= 0:
                      print(src[max(0,idx2-200):idx2+300])
              sys.exit(1)
          open(path, 'w').write(src.replace(old, new, 1))
          print('W1 applied')
          PYEOF

      # ── 6. Apply W2 — extend drain guard ─────────────────────────────────
      - name: "[W2] Extend journal drain guard to __MSYS__/__CYGWIN__"
        run: |
          cd /tmp/openplc-runtime
          python3 - <<'PYEOF'
          import sys
          path = 'core/src/plc_app/plc_state_manager.cpp'
          src = open(path).read()
          old = '#ifdef __APPLE__\n            /* macOS: SCHED_FIFO unavailable; task bodies often overrun the\n'
          new = '#if defined(__APPLE__) || defined(__CYGWIN__) || defined(__MSYS__)\n            /* macOS/MSYS2/Cygwin: SCHED_FIFO unavailable; task bodies often overrun the\n'
          if old not in src:
              print('W2 anchor not found', file=sys.stderr)
              idx = src.find('debug_write_journal_drain')
              print('drain context:', src[max(0,idx-300):idx+100] if idx >= 0 else '(not found)')
              sys.exit(1)
          open(path, 'w').write(src.replace(old, new, 1))
          print('W2 applied')
          PYEOF

      # ── 7. W3 — no-op: MSYS2/Cygwin pthread_setname_np is 2-arg (same as Linux)
      # The macOS patch already uses #ifdef __APPLE__ for the 1-arg form.
      # MSYS2/Cygwin winpthread declares: int pthread_setname_np(pthread_t, const char*)
      # so the existing #else branch (2-arg) is already correct for Windows. No patch needed.
      - name: "[W3] pthread_setname_np — verify macOS guard is correct (no-op on MSYS2)"
        run: |
          cd /tmp/openplc-runtime
          grep -n 'pthread_setname_np' core/src/plc_app/plc_state_manager.cpp
          echo "W3: macOS patch already uses #ifdef __APPLE__ only — correct for MSYS2 (2-arg form)"

      # ── 8. Apply W4 — /proc/meminfo wmic fallback ─────────────────────────
      - name: "[W4] /proc/meminfo wmic fallback in compile.sh"
        run: |
          cd /tmp/openplc-runtime
          python3 - <<'PYEOF'
          import sys
          path = 'scripts/compile.sh'
          src = open(path).read()
          old = '# /proc/meminfo is Linux-only; on macOS use sysctl\nif [ -f /proc/meminfo ]; then\n    MEM_KB=$(awk \'/^MemTotal:/{print $2}\' /proc/meminfo)\nelse\n    MEM_KB=$(( $(sysctl -n hw.memsize 2>/dev/null || echo 4294967296) / 1024 ))\nfi'
          new = '# /proc/meminfo is Linux-only; fall back by platform\nif [ -f /proc/meminfo ]; then\n    MEM_KB=$(awk \'/^MemTotal:/{print $2}\' /proc/meminfo)\nelif sysctl -n hw.memsize >/dev/null 2>&1; then\n    MEM_KB=$(( $(sysctl -n hw.memsize) / 1024 ))\nelif command -v wmic >/dev/null 2>&1; then\n    MEM_KB=$(wmic OS get TotalVisibleMemorySize /value 2>/dev/null | grep = | cut -d= -f2 | tr -d \'\\r\\n\' || echo 4194304)\nelse\n    MEM_KB=4194304\nfi'
          if old not in src:
              print('W4 anchor not found', file=sys.stderr)
              idx = src.find('proc/meminfo')
              print('context:', src[max(0,idx-100):idx+300] if idx >= 0 else '(not found)')
              sys.exit(1)
          open(path, 'w').write(src.replace(old, new, 1))
          print('W4 applied')
          PYEOF

      # ── 9. Apply W5 — date +%s%N guard ───────────────────────────────────
      - name: "[W5] date +%s%N guard in compile-clean.sh"
        run: |
          cd /tmp/openplc-runtime
          python3 - <<'PYEOF'
          import sys
          path = 'scripts/compile-clean.sh'
          src = open(path).read()
          old = 'TIMESTAMP=$(date +%s%N)'
          new = '# %N (nanoseconds) is GNU date; MSYS2 may not support it\nTIMESTAMP=$(date +%s%N 2>/dev/null || echo "$(date +%s)$$")'
          if old not in src:
              print('W5 anchor not found', file=sys.stderr)
              idx = src.find('TIMESTAMP')
              print('context:', src[max(0,idx-100):idx+200] if idx >= 0 else '(not found)')
              sys.exit(1)
          open(path, 'w').write(src.replace(old, new, 1))
          print('W5 applied')
          PYEOF

      # ── W10. Remove -lrt from Makefile.strucpp link line (MSYS2 has no librt) ─
      - name: "[W10] Remove -lrt from Makefile.strucpp (not on MSYS2/Cygwin)"
        run: |
          set -e
          cp "$GITHUB_WORKSPACE/openplc-editor-development/openplc-runtime-macos/test-fixtures/w10_makefile_lrt.py" /tmp/w10_makefile_lrt.py
          cd /tmp/openplc-runtime
          python3 /tmp/w10_makefile_lrt.py
          echo "=== W10 verification ==="
          grep -n "lrt\|IS_WINDOWS" scripts/Makefile.strucpp | tail -5

      # ── W12. Fix condvar clock mismatch on MSYS2 (CLOCK_MONOTONIC not supported) ─
      # Root cause: the scan cycle dispatcher's done_cond is initialized with
      # CLOCK_MONOTONIC via pthread_condattr_setclock(). On Cygwin/MSYS2 winpthread,
      # this call is silently ignored — the condvar stays on CLOCK_REALTIME. The
      # timedwait deadline uses next_tick (computed with CLOCK_MONOTONIC), but the
      # condvar compares against CLOCK_REALTIME → the deadline never triggers →
      # the scan cycle hangs → watchdog fires → STATUS:ERROR.
      # Fix: guard CLOCK_MONOTONIC condattr_setclock to Linux-only; on MSYS2 the
      # condvar stays on CLOCK_REALTIME and next_tick is computed with CLOCK_REALTIME.
      - name: "[W12] Fix condvar CLOCK_MONOTONIC mismatch on MSYS2"
        run: |
          set -e
          cp "$GITHUB_WORKSPACE/openplc-editor-development/openplc-runtime-macos/test-fixtures/w12_cond_clock.py" /tmp/w12_cond_clock.py
          cd /tmp/openplc-runtime
          python3 /tmp/w12_cond_clock.py
          echo "=== W12 verification ==="
          grep -n "CYGWIN\|MSYS.*REALTIME\|setclock\|next_tick" core/src/plc_app/plc_state_manager.cpp | head -10

      # ── W6. Fix zipfile stream exhaustion in app.py ─────────────────────────
      # Werkzeug FileStorage is NOT a seekable stream. zipfile.is_zipfile() reads
      # to EOF; subsequent ZipFile() calls fail with "negative seek value -1".
      # Fix: read the FileStorage into io.BytesIO (fully seekable in-memory bytes)
      # right after the content_length check, before analyze_zip/safe_extract.
      - name: "[W6] Patch upload handler to write zip to temp file (bypass stream seek)"
        run: |
          set -e
          cp "$GITHUB_WORKSPACE/openplc-editor-development/openplc-runtime-macos/test-fixtures/w6_patch_app.py" /tmp/w6_patch_app.py
          cd /tmp/openplc-runtime
          python3 /tmp/w6_patch_app.py
          echo "=== app.py patch verification ==="
          grep -n "_zip_path\|upload_tmp\|analyze_zip\|safe_extract\|_os.unlink" webserver/app.py

      # ── ZIPFILE ISOLATION TEST ─────────────────────────────────────────────
      # Test the REAL motor-start-proof.zip directly (no Flask/upload path)
      # to isolate whether the EINVAL is in the zip file structure or the
      # upload path. Tests all three open modes: path string, open(rb), BytesIO.
      - name: "[DIAG] Zipfile read isolation test with real motor-start-proof.zip"
        continue-on-error: true
        run: |
          REAL_ZIP="$GITHUB_WORKSPACE/openplc-editor-development/openplc-runtime-macos/test-fixtures/motor-start-proof.zip"
          python3 - "$REAL_ZIP" <<'PYEOF'
          import zipfile, os, io, sys, tempfile, hashlib

          real_zip = sys.argv[1]
          print(f"Real zip: {real_zip} ({os.path.getsize(real_zip)} bytes)")
          print(f"SHA256: {hashlib.sha256(open(real_zip,'rb').read()).hexdigest()}")

          # --- Test A: open real zip by path string directly ---
          print("\n=== Test A: ZipFile(real_path) ===")
          try:
              with zipfile.ZipFile(real_zip, "r") as zf:
                  for info in zf.infolist():
                      data = zf.read(info.filename)
                      print(f"  OK: {info.filename} ({len(data)} bytes)")
              print("Test A: PASS")
          except OSError as e:
              print(f"Test A: FAIL — {e}")

          # --- Test B: copy real zip to /tmp, open by path ---
          tmp_dir = tempfile.mkdtemp()
          tmp_zip = os.path.join(tmp_dir, "motor_test.zip")
          with open(real_zip, "rb") as src, open(tmp_zip, "wb") as dst:
              dst.write(src.read())
          print(f"\n=== Test B: ZipFile(tmp_path) — copy at {tmp_zip} ===")
          try:
              with zipfile.ZipFile(tmp_zip, "r") as zf:
                  for info in zf.infolist():
                      data = zf.read(info.filename)
                      print(f"  OK: {info.filename} ({len(data)} bytes)")
              print("Test B: PASS")
          except OSError as e:
              print(f"Test B: FAIL — {e}")

          # --- Test C: BytesIO of real zip — single ZipFile, zf.open() per entry ---
          # This matches exactly what the new W8 safe_extract does.
          print("\n=== Test C: ZipFile(BytesIO) + zf.open() per entry ===")
          try:
              raw = open(real_zip, "rb").read()
              bio = io.BytesIO(raw)
              bio.seek(0)
              with zipfile.ZipFile(bio, "r") as zf:
                  for info in zf.infolist():
                      with zf.open(info.filename) as entry:
                          data = entry.read()
                      print(f"  OK: {info.filename} ({len(data)} bytes)")
              print("Test C: PASS")
          except OSError as e:
              print(f"Test C: FAIL — {e}")

          # --- Test D: simulate full W6 flow without Flask ---
          # Simulate: receive bytes (as Flask would), write to BytesIO directly,
          # pass BytesIO to analyze_zip (is_zipfile + ZipFile read), then
          # rewind and pass to safe_extract (ZipFile + zf.open per entry).
          print("\n=== Test D: full W6+W8 flow simulation (no Flask) ===")
          try:
              # Simulate FileStorage.read() returning bytes
              raw = open(real_zip, "rb").read()
              bio = io.BytesIO(raw)
              # simulate analyze_zip: is_zipfile + ZipFile open
              bio.seek(0)
              assert zipfile.is_zipfile(bio), "not a zip"
              bio.seek(0)
              with zipfile.ZipFile(bio, "r") as zf:
                  _ = zf.infolist()  # analyze_zip reads infolist
              # simulate safe_extract: rewind, open, extract all
              bio.seek(0)
              with zipfile.ZipFile(bio, "r") as zf:
                  for info in zf.infolist():
                      with zf.open(info.filename) as entry:
                          data = entry.read()
                      print(f"  OK: {info.filename} ({len(data)} bytes)")
              print("Test D: PASS")
          except (OSError, AssertionError) as e:
              print(f"Test D: FAIL — {e}")

          PYEOF

      # ── W8. Fix safe_extract: open zip via explicit binary handle (Cygwin seek fix) ─
      # Root cause (confirmed by W9 traceback): zipfile.ZipFile(path_string) on
      # Cygwin/MSYS2 Python 3.12 creates an internal file handle that fails to seek
      # (EINVAL). The call chain is zf.read() -> zf.open() -> zef_file.read() ->
      # self._file.seek(self._pos) -> OSError: [Errno 22].
      # Fix: open the zip file explicitly as open(zip_path, "rb") first, then pass
      # the file object to zipfile.ZipFile(f). Python uses the provided handle
      # directly rather than opening internally, giving a proper seekable stream.
      - name: "[W8] Fix safe_extract: open zip via explicit binary handle"
        run: |
          set -e
          cp "$GITHUB_WORKSPACE/openplc-editor-development/openplc-runtime-macos/test-fixtures/w8_fix_safe_extract.py" /tmp/w8_fix_safe_extract.py
          cd /tmp/openplc-runtime
          python3 /tmp/w8_fix_safe_extract.py
          echo "=== W8 verification ==="
          grep -n "subprocess\|unzip\|_is_cygwin\|zip_src\|abs_dest" webserver/plcapp_management.py || true

      # ── W9. Add full traceback logging to exception handler (diagnostic) ────
      - name: "[W9] Add full traceback to upload exception handler"
        run: |
          set -e
          cp "$GITHUB_WORKSPACE/openplc-editor-development/openplc-runtime-macos/test-fixtures/w9_traceback_logging.py" /tmp/w9_traceback_logging.py
          cd /tmp/openplc-runtime
          python3 /tmp/w9_traceback_logging.py

      # ── 10. BUILD WITH W1-W5 ──────────────────────────────────────────────
      - name: "[STEP 3.2] Build WITH all W1-W5 patches"
        id: build_with_w
        run: |
          cd /tmp/openplc-runtime
          rm -rf build && mkdir build && cd build
          echo "=== CMake ==="
          cmake .. -G "Unix Makefiles" 2>&1
          echo "=== Ninja ==="
          make -j$(nproc) plc_main 2>&1
          echo "=== Binary ==="
          ls -lh plc_main* 2>/dev/null

      # ── 10b. DEPENDENCY AUDIT ─────────────────────────────────────────────
      # Dump the exact DLL dependency tree for plc_main.exe and new_libplc.so
      # (the compiled PLC program). This is Problem A data — what must be
      # bundled alongside the binary on a machine with no MSYS2 installed.
      - name: "[AUDIT] Dump DLL dependencies of plc_main + new_libplc.so"
        run: |
          echo "=== ldd plc_main ==="
          ldd /tmp/openplc-runtime/build/plc_main 2>&1 || true

          echo ""
          echo "=== objdump -p plc_main (DLL imports) ==="
          objdump -p /tmp/openplc-runtime/build/plc_main 2>&1 | grep "DLL Name:" | sort -u || true

          echo ""
          echo "=== MSYS2 DLL locations ==="
          # Show where each dependency lives so we know which are MSYS2 vs Windows system
          ldd /tmp/openplc-runtime/build/plc_main 2>&1 | grep -v "not found\|Windows\|system32\|SysWOW" | grep -i "\.dll" | awk '{print $3}' | sort -u | while read f; do
            [ -f "$f" ] && echo "$f  ($(du -sh "$f" 2>/dev/null | cut -f1))"
          done || true

          echo ""
          echo "=== plc_main binary info ==="
          file /tmp/openplc-runtime/build/plc_main
          size /tmp/openplc-runtime/build/plc_main 2>/dev/null || true

          echo ""
          echo "=== iec2c.exe ldd (for comparison) ==="
          # iec2c.exe is MinGW-built; compare its deps to plc_main (MSYS2-built)
          IECEXE="/d/a/volt/volt/resources/plc-runtime/matiec/win32-x64/iec2c.exe"
          [ -f "$IECEXE" ] && ldd "$IECEXE" 2>&1 || echo "(iec2c.exe not found at expected path)"

          echo ""
          echo "=== Full MSYS2 DLL inventory under /usr/bin ==="
          # List all msys-*.dll and libgcc/libstdc++ variants present
          ls /usr/bin/msys-*.dll /usr/bin/cygwin*.dll 2>/dev/null | sort || echo "(none matching)"
          ls /usr/bin/msys-2.0.dll 2>/dev/null && echo "msys-2.0.dll present" || echo "msys-2.0.dll NOT present"
          echo ""
          echo "=== Size of msys-2.0.dll ==="
          ls -lh /usr/bin/msys-2.0.dll 2>/dev/null || echo "not found"

      # ── 10c. PROBLEM A — Minimal DLL bundle test ──────────────────────────
      # Copy plc_main + its non-Windows DLL deps to a clean directory.
      # Then run plc_main from that directory WITHOUT MSYS2 on PATH to test
      # whether it self-contains.
      - name: "[AUDIT] Problem A — collect non-Windows DLLs needed by plc_main"
        run: |
          mkdir -p /tmp/plc-bundle
          cp /tmp/openplc-runtime/build/plc_main /tmp/plc-bundle/

          echo "=== Collecting MSYS2/non-system DLLs ==="
          ldd /tmp/openplc-runtime/build/plc_main 2>&1 | grep -v "Windows\|system32\|SysWOW\|not found" | grep "\.dll" | awk '{print $3}' | sort -u | while read f; do
            if [ -f "$f" ]; then
              cp "$f" /tmp/plc-bundle/
              echo "Copied: $(basename $f)  ($(du -sh "$f" | cut -f1))"
            fi
          done

          echo ""
          echo "=== Bundle contents ==="
          ls -lh /tmp/plc-bundle/
          echo ""
          echo "=== Bundle total size ==="
          du -sh /tmp/plc-bundle/

      # ── 11. Python deps + webserver ───────────────────────────────────────
      # MSYS2 Python enforces PEP 668 — must use a venv for pip installs.
      # plc_main embeds libpython and scans the system path for plugins, so we
      # set PYTHONPATH to the venv site-packages before launching it — that way
      # pymodbus, asyncua, flask, etc. are all visible to the embedded interpreter.
      - name: Install Python dependencies (venv)
        run: |
          python3 -m venv /tmp/plcvenv
          /tmp/plcvenv/bin/pip install --upgrade pip
          # asyncua requires cryptography which requires maturin (Rust) — fails on Cygwin SOABI.
          # pymodbus/asyncua are optional driver plugins; plc_main logs errors but continues.
          # Only install what the webserver actually needs.
          /tmp/plcvenv/bin/pip install \
            flask flask-login flask-sqlalchemy flask-jwt-extended flask-socketio flask-cors eventlet python-dotenv 2>&1
          echo "PYTHONPATH=/tmp/plcvenv/lib/python3.12/site-packages" >> $GITHUB_ENV

      # Scripts are checked in as test fixtures — copy them to C:\ so pwsh
      # can call them directly. MUST happen before any nohup launches because
      # any msys2 shell step after a nohup background process hangs under the
      # Windows CMD wrapper signal handling.
      - name: Copy Python test scripts from repo
        shell: pwsh
        run: |
          $fixtures = "$env:GITHUB_WORKSPACE\openplc-editor-development\openplc-runtime-macos\test-fixtures"
          Copy-Item "$fixtures\plc_wait_webserver.py" C:\plc_wait_webserver.py
          Copy-Item "$fixtures\plc_af_unix.py"        C:\plc_af_unix.py
          Copy-Item "$fixtures\plc_setup_user.py"     C:\plc_setup_user.py
          Copy-Item "$fixtures\plc_login.py"          C:\plc_login.py
          Copy-Item "$fixtures\plc_upload.py"         C:\plc_upload.py
          Copy-Item "$fixtures\plc_start.py"          C:\plc_start.py
          # Also stage the AF_UNIX script at a clean MSYS2 path for the test below
          Copy-Item "$fixtures\plc_af_unix.py"        "C:\msys64\tmp\plc_af_unix.py"

      - name: Start plc_main and run AF_UNIX test
        id: af_unix_test
        continue-on-error: true
        run: |
          cd /tmp/openplc-runtime
          # Copy AF_UNIX script to MSYS2 /tmp/ now (inside msys2 shell = correct path)
          cp /c/plc_af_unix.py /tmp/plc_af_unix.py
          # Start plc_main in background THEN immediately test AF_UNIX.
          # MUST NOT start webserver nohup before this msys2 step — two nohup
          # processes cause the CMD wrapper to hang.
          nohup ./build/plc_main > /tmp/plc_main_win.log 2>&1 &
          sleep 10
          echo "=== plc_main startup log ==="
          cat /tmp/plc_main_win.log
          echo "=== socket file check ==="
          ls -la /tmp/plc_runtime.socket 2>/dev/null || echo "socket not yet present"
          echo "=== [STEP 2] AF_UNIX socket test ==="
          python3 /tmp/plc_af_unix.py

      - name: Start webserver (background)
        run: |
          cd /tmp/openplc-runtime
          # Write log to C:\webserver_win.log (Windows path) so Windows Python
          # in subsequent pwsh steps can read it without /tmp/ path translation.
          nohup /tmp/plcvenv/bin/python3 -m webserver.app > /c/webserver_win.log 2>&1 &
          echo "webserver started"

      - name: Wait for webserver ready
        shell: pwsh
        run: python C:\plc_wait_webserver.py

      # ── 12b. Create first user (no-auth endpoint when DB is empty) ────────
      # The upstream webserver has no seeded default credentials. On first run
      # /create-user is open (no auth required) when no users exist yet.
      - name: Create volt user via /create-user
        shell: pwsh
        run: python C:\plc_setup_user.py

      # ── 13. API login + status ────────────────────────────────────────────
      - name: API login + runtime status
        id: api_status
        shell: pwsh
        run: python C:\plc_login.py

      # ── 14. Upload real motor-start ZIP + compile ─────────────────────────
      - name: Upload motor-start program ZIP
        shell: pwsh
        env:
          MOTOR_ZIP: C:\motor_start.zip
        run: |
          Copy-Item "$env:GITHUB_WORKSPACE\openplc-editor-development\openplc-runtime-macos\test-fixtures\motor-start-proof.zip" C:\motor_start.zip
          python C:\plc_upload.py

      # ── 15. Start PLC + verify RUNNING ───────────────────────────────────
      - name: Start PLC and verify STATUS:RUNNING
        shell: pwsh
        run: python C:\plc_start.py

      # ── 16. STEP 4 — Motor-start force/read proof via Socket.IO ─────────
      # Use Node.js (available on all GH Actions runners) for Socket.IO,
      # matching the exact macOS proof script. Script is checked in as a
      # test fixture to avoid PowerShell heredoc quoting issues.
      - name: Set up Node.js for debug stream test
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install socket.io-client (Node)
        shell: pwsh
        run: |
          $nmDir = "C:\npm-modules"
          New-Item -ItemType Directory -Force -Path $nmDir | Out-Null
          Set-Location $nmDir
          npm init -y | Out-Null
          npm install socket.io-client --save
          Write-Output "NODE_MODULES_DIR=$nmDir\node_modules" >> $env:GITHUB_ENV

      - name: "[STEP 4] Motor-start PB_START force -> MOTOR_RUN latch proof"
        id: motor_proof
        shell: pwsh
        run: |
          $script = "$env:GITHUB_WORKSPACE\openplc-editor-development\openplc-runtime-macos\test-fixtures\debug-proof.mjs"
          $nmDir  = $env:NODE_MODULES_DIR
          Write-Host "Running: node $script $nmDir"
          node $script $nmDir

      # ── STEP 4b. TON timer accumulation proof ────────────────────────────
      # The motor-start program contains a TON timer (RUN_TMR, PT=30s).
      # This proof forces MOTOR_RUN, reads RUN_TMR.ET twice, and confirms ET
      # accumulates — proving the scan cycle executes timing-sensitive code
      # (CLOCK_REALTIME-based condvar path, W12 fix).
      - name: "[STEP 4b] TON timer accumulation proof (RUN_TMR.ET)"
        id: timer_proof
        shell: pwsh
        run: |
          $script = "$env:GITHUB_WORKSPACE\openplc-editor-development\openplc-runtime-macos\test-fixtures\timer-proof.mjs"
          $nmDir  = $env:NODE_MODULES_DIR
          Write-Host "Running: node $script $nmDir"
          node $script $nmDir

      # ── 17. Dump all logs (always) ────────────────────────────────────────
      - name: Dump process logs
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== plc_main log ==="
          Get-Content "C:\msys64\tmp\plc_main_win.log" -ErrorAction SilentlyContinue | Write-Host
          Write-Host "=== webserver log (full — includes tracebacks) ==="
          Get-Content "C:\webserver_win.log" -ErrorAction SilentlyContinue | Write-Host

      # ── 18. Save AF_UNIX verdict to summary ───────────────────────────────
      - name: Write job summary
        if: always()
        shell: pwsh
        run: |
          $af    = "${{ steps.af_unix_test.outcome }}"
          $build = "${{ steps.build_with_w.outcome }}"
          $motor = "${{ steps.motor_proof.outcome }}"
          $timer = "${{ steps.timer_proof.outcome }}"
          @"
          ## Windows Runtime Test Results

          | Check | Result |
          |---|---|
          | Build (W1-W12 patches) | $build |
          | AF_UNIX socket | $af |
          | Motor-start latch proof | $motor |
          | TON timer accumulation proof | $timer |
          "@ >> $env:GITHUB_STEP_SUMMARY

  # ── 10x REPEAT RELIABILITY JOB ───────────────────────────────────────────
  # Runs the full force/read cycle 10 times back-to-back in one job to catch
  # intermittent failures: socket timing races, scan cycle jitter, condvar
  # spurious wakeups. Reports real pass/fail count out of 10.
  # Skipped on schedule to avoid doubling weekly CI cost; runs on push+dispatch.
  windows-repeat-test:
    name: Windows 10x repeat reliability test
    runs-on: windows-latest
    if: github.event_name != 'schedule'
    needs: windows-build-test
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Disable git CRLF conversion
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout volt repo
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: >-
            base-devel gcc make cmake pkg-config python python-pip
            python-setuptools git patch openssl openssl-devel unzip

      - name: Clone + patch OpenPLC Runtime
        run: |
          git clone https://github.com/Autonomy-Logic/openplc-runtime.git /tmp/openplc-runtime
          cd /tmp/openplc-runtime
          git checkout cb1060d
          patch -p1 < "$GITHUB_WORKSPACE/openplc-editor-development/openplc-runtime-macos/openplc-runtime-macos-cb1060d.patch"
          # W1
          python3 - <<'PYEOF'
          import sys, re
          path = 'core/src/plc_app/plc_state_manager.cpp'
          src = open(path).read()
          old = '#ifdef __APPLE__\n    /* On macOS, pthread_cond_timedwait uses CLOCK_REALTIME (the condvar was\n     * initialized without pthread_condattr_setclock, which macOS doesn\'t\n     * support for CLOCK_MONOTONIC).  Use CLOCK_REALTIME here to match. */\n    clock_gettime(CLOCK_REALTIME, &next_tick);\n#else\n    clock_gettime(CLOCK_MONOTONIC, &next_tick);\n#endif'
          new = '#if defined(__APPLE__) || defined(__CYGWIN__) || defined(__MSYS__)\n    /* macOS/MSYS2/Cygwin: pthread_cond_timedwait uses CLOCK_REALTIME.\n     * pthread_condattr_setclock(CLOCK_MONOTONIC) is unsupported. */\n    clock_gettime(CLOCK_REALTIME, &next_tick);\n#else\n    clock_gettime(CLOCK_MONOTONIC, &next_tick);\n#endif'
          assert old in src, 'W1 anchor not found'
          open(path, 'w').write(src.replace(old, new, 1))
          print('W1 done')
          PYEOF
          # W2
          python3 - <<'PYEOF'
          import sys
          path = 'core/src/plc_app/plc_state_manager.cpp'
          src = open(path).read()
          old = '#ifdef __APPLE__\n            /* macOS: SCHED_FIFO unavailable; task bodies often overrun the\n'
          new = '#if defined(__APPLE__) || defined(__CYGWIN__) || defined(__MSYS__)\n            /* macOS/MSYS2/Cygwin: SCHED_FIFO unavailable; task bodies often overrun the\n'
          assert old in src, 'W2 anchor not found'
          open(path, 'w').write(src.replace(old, new, 1))
          print('W2 done')
          PYEOF
          # W4
          python3 - <<'PYEOF'
          path = 'scripts/compile.sh'
          src = open(path).read()
          old = '# /proc/meminfo is Linux-only; on macOS use sysctl\nif [ -f /proc/meminfo ]; then\n    MEM_KB=$(awk \'/^MemTotal:/{print $2}\' /proc/meminfo)\nelse\n    MEM_KB=$(( $(sysctl -n hw.memsize 2>/dev/null || echo 4294967296) / 1024 ))\nfi'
          new = '# /proc/meminfo is Linux-only; fall back by platform\nif [ -f /proc/meminfo ]; then\n    MEM_KB=$(awk \'/^MemTotal:/{print $2}\' /proc/meminfo)\nelif sysctl -n hw.memsize >/dev/null 2>&1; then\n    MEM_KB=$(( $(sysctl -n hw.memsize) / 1024 ))\nelif command -v wmic >/dev/null 2>&1; then\n    MEM_KB=$(wmic OS get TotalVisibleMemorySize /value 2>/dev/null | grep = | cut -d= -f2 | tr -d \'\\r\\n\' || echo 4194304)\nelse\n    MEM_KB=4194304\nfi'
          assert old in src, 'W4 anchor not found'
          open(path, 'w').write(src.replace(old, new, 1))
          print('W4 done')
          PYEOF
          # W5
          python3 - <<'PYEOF'
          path = 'scripts/compile-clean.sh'
          src = open(path).read()
          old = 'TIMESTAMP=$(date +%s%N)'
          new = 'TIMESTAMP=$(date +%s%N 2>/dev/null || echo "$(date +%s)$$")'
          assert old in src, 'W5 anchor not found'
          open(path, 'w').write(src.replace(old, new, 1))
          print('W5 done')
          PYEOF
          # W10
          cp "$GITHUB_WORKSPACE/openplc-editor-development/openplc-runtime-macos/test-fixtures/w10_makefile_lrt.py" /tmp/w10_makefile_lrt.py
          python3 /tmp/w10_makefile_lrt.py
          # W12
          cp "$GITHUB_WORKSPACE/openplc-editor-development/openplc-runtime-macos/test-fixtures/w12_cond_clock.py" /tmp/w12_cond_clock.py
          python3 /tmp/w12_cond_clock.py
          # W6
          cp "$GITHUB_WORKSPACE/openplc-editor-development/openplc-runtime-macos/test-fixtures/w6_patch_app.py" /tmp/w6_patch_app.py
          python3 /tmp/w6_patch_app.py
          # W8
          cp "$GITHUB_WORKSPACE/openplc-editor-development/openplc-runtime-macos/test-fixtures/w8_fix_safe_extract.py" /tmp/w8_fix_safe_extract.py
          python3 /tmp/w8_fix_safe_extract.py

      - name: Build
        run: |
          cd /tmp/openplc-runtime
          mkdir build && cd build
          cmake .. -G "Unix Makefiles" 2>&1
          make -j$(nproc) plc_main 2>&1
          ls -lh plc_main

      # ── PROBLEM B AUDIT — compiler tool dependency graph ─────────────────
      # g++, make, cmake are needed at RUNTIME on the user's machine (not just
      # our CI) because Volt compiles the user's ST→C++ program on-device.
      # Capture their DLL deps so we know the minimal toolchain bundle size.
      - name: "[AUDIT] Problem B — compiler tool DLL dependencies"
        run: |
          echo "=== g++ ==="
          which g++ && g++ --version | head -1
          ldd $(which g++) 2>&1 | grep -v "Windows\|system32\|SysWOW" | grep "\.dll" || true

          echo ""
          echo "=== make ==="
          which make && make --version | head -1
          ldd $(which make) 2>&1 | grep -v "Windows\|system32\|SysWOW" | grep "\.dll" || true

          echo ""
          echo "=== cmake ==="
          which cmake && cmake --version | head -1
          ldd $(which cmake) 2>&1 | grep -v "Windows\|system32\|SysWOW" | grep "\.dll" || true

          echo ""
          echo "=== bash ==="
          ldd $(which bash) 2>&1 | grep -v "Windows\|system32\|SysWOW" | grep "\.dll" || true

          echo ""
          echo "=== as (assembler, needed by g++) ==="
          ldd $(which as) 2>&1 | grep -v "Windows\|system32\|SysWOW" | grep "\.dll" || true

          echo ""
          echo "=== cc1plus (g++ front-end) ==="
          CC1=$(g++ -print-prog-name=cc1plus 2>/dev/null)
          [ -n "$CC1" ] && ldd "$CC1" 2>&1 | grep -v "Windows\|system32\|SysWOW" | grep "\.dll" || true

          echo ""
          echo "=== Unique non-system DLLs across all compiler tools ==="
          for tool in $(which g++) $(which make) $(which bash) $(which as); do
            ldd "$tool" 2>&1
          done | grep -v "Windows\|system32\|SysWOW\|not found" | grep "\.dll" | awk '{print $3}' | sort -u | while read f; do
            [ -f "$f" ] && echo "$(basename $f)  $(du -sh "$f" | cut -f1)  $f"
          done

          echo ""
          echo "=== Minimal toolchain bundle estimate ==="
          TOTAL=0
          for tool in $(which g++) $(which make) $(which bash) $(which as); do
            ldd "$tool" 2>&1
          done | grep -v "Windows\|system32\|SysWOW\|not found" | grep "\.dll" | awk '{print $3}' | sort -u | while read f; do
            [ -f "$f" ] && du -b "$f"
          done | awk '{sum+=$1} END {printf "Non-system DLLs: %.1f MB\n", sum/1048576}'

          echo ""
          echo "=== Compiler binary sizes ==="
          for tool in $(which g++) $(which make) $(which cmake) $(which bash) $(which as); do
            ls -lh "$tool" 2>/dev/null
          done
          # cc1plus is the heaviest g++ component
          CC1=$(g++ -print-prog-name=cc1plus 2>/dev/null)
          [ -n "$CC1" ] && ls -lh "$CC1"
          # Also find libexec/gcc tree
          GCC_LIBEXEC=$(g++ -print-libgcc-file-name 2>/dev/null | xargs dirname 2>/dev/null)
          [ -n "$GCC_LIBEXEC" ] && du -sh "$GCC_LIBEXEC" 2>/dev/null || true

          echo ""
          echo "=== Full MSYS2 base install size ==="
          du -sh /usr/ 2>/dev/null | head -5 || true

      - name: Install Python deps
        run: |
          python3 -m venv /tmp/plcvenv
          /tmp/plcvenv/bin/pip install -q flask flask-login flask-sqlalchemy flask-jwt-extended flask-socketio flask-cors eventlet python-dotenv
          echo "PYTHONPATH=/tmp/plcvenv/lib/python3.12/site-packages" >> $GITHUB_ENV

      - name: Copy test scripts
        shell: pwsh
        run: |
          $f = "$env:GITHUB_WORKSPACE\openplc-editor-development\openplc-runtime-macos\test-fixtures"
          Copy-Item "$f\plc_wait_webserver.py" C:\plc_wait_webserver.py
          Copy-Item "$f\plc_setup_user.py"     C:\plc_setup_user.py
          Copy-Item "$f\plc_upload.py"         C:\plc_upload.py
          Copy-Item "$f\plc_start.py"          C:\plc_start.py
          Copy-Item "$f\plc_af_unix.py"        C:\plc_af_unix.py

      - name: Start runtime + webserver
        run: |
          cd /tmp/openplc-runtime
          cp /c/plc_af_unix.py /tmp/plc_af_unix.py
          nohup ./build/plc_main > /tmp/plc_main_repeat.log 2>&1 &
          sleep 10
          nohup /tmp/plcvenv/bin/python3 -m webserver.app > /c/webserver_repeat.log 2>&1 &

      - name: Wait + create user + upload program
        shell: pwsh
        run: |
          python C:\plc_wait_webserver.py
          python C:\plc_setup_user.py
          Copy-Item "$env:GITHUB_WORKSPACE\openplc-editor-development\openplc-runtime-macos\test-fixtures\motor-start-proof.zip" C:\motor_start.zip
          python C:\plc_upload.py
          python C:\plc_start.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install socket.io-client
        shell: pwsh
        run: |
          $nmDir = "C:\npm-modules-repeat"
          New-Item -ItemType Directory -Force -Path $nmDir | Out-Null
          Set-Location $nmDir
          npm init -y | Out-Null
          npm install socket.io-client --save
          Write-Output "REPEAT_NM=$nmDir\node_modules" >> $env:GITHUB_ENV

      - name: Run 10x force/read cycle
        id: repeat_test
        shell: pwsh
        run: |
          $script  = "$env:GITHUB_WORKSPACE\openplc-editor-development\openplc-runtime-macos\test-fixtures\debug-proof.mjs"
          $nmDir   = $env:REPEAT_NM
          $pass = 0; $fail = 0
          for ($i = 1; $i -le 10; $i++) {
            Write-Host "`n══ Run $i / 10 ══"
            $result = & node $script $nmDir 2>&1
            $result | ForEach-Object { Write-Host $_ }
            if ($LASTEXITCODE -eq 0) { $pass++ } else { $fail++ }
            Start-Sleep -Milliseconds 500
          }
          Write-Host "`n══════════════════════════════════════════"
          Write-Host "10x repeat result: PASS=$pass  FAIL=$fail"
          Write-Host "══════════════════════════════════════════"
          "REPEAT_PASS=$pass" >> $env:GITHUB_ENV
          "REPEAT_FAIL=$fail" >> $env:GITHUB_ENV
          if ($fail -gt 0) { exit 1 }

      - name: Run 10x timer proof cycle
        id: repeat_timer
        shell: pwsh
        run: |
          $script  = "$env:GITHUB_WORKSPACE\openplc-editor-development\openplc-runtime-macos\test-fixtures\timer-proof.mjs"
          $nmDir   = $env:REPEAT_NM
          $pass = 0; $fail = 0
          for ($i = 1; $i -le 10; $i++) {
            Write-Host "`n══ Timer Run $i / 10 ══"
            $result = & node $script $nmDir 2>&1
            $result | ForEach-Object { Write-Host $_ }
            if ($LASTEXITCODE -eq 0) { $pass++ } else { $fail++ }
            Start-Sleep -Milliseconds 300
          }
          Write-Host "`n══════════════════════════════════════════"
          Write-Host "10x timer result: PASS=$pass  FAIL=$fail"
          Write-Host "══════════════════════════════════════════"
          "TIMER_PASS=$pass" >> $env:GITHUB_ENV
          "TIMER_FAIL=$fail" >> $env:GITHUB_ENV
          if ($fail -gt 0) { exit 1 }

      - name: Write repeat summary
        if: always()
        shell: pwsh
        run: |
          $rp = "${{ steps.repeat_test.outcome }}"
          $tp = "${{ steps.repeat_timer.outcome }}"
          @"
          ## Windows 10x Repeat Reliability Results

          | Test | Result | Pass | Fail |
          |---|---|---|---|
          | Motor-start latch (10x) | $rp | $env:REPEAT_PASS | $env:REPEAT_FAIL |
          | TON timer accumulation (10x) | $tp | $env:TIMER_PASS | $env:TIMER_FAIL |
          "@ >> $env:GITHUB_STEP_SUMMARY
